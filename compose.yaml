services:
  content-producer:
    build:
      context: .
      dockerfile: Dockerfile
    image: content-producer:latest
    container_name: content-producer
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    environment:
      DOTNET_ENVIRONMENT: Production
      TZ: ${TZ:-Asia/Tehran}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      WORDPRESS_USERNAME: ${WORDPRESS_USERNAME}
      WORDPRESS_APPLICATION_PASSWORD: ${WORDPRESS_APPLICATION_PASSWORD}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      Scheduler__StartAt: ${SCHEDULER_START_AT:-08:00:00}
      Scheduler__TimeZoneId: ${SCHEDULER_TIME_ZONE_ID:-Asia/Tehran}
      ContentGeneration__LlmProvider: ${LLM_PROVIDER:-OpenAI}
      ContentGeneration__ImageProvider: ${IMAGE_PROVIDER:-Pollinations}
      ContentGeneration__PromptFilePath: ${ARTICLE_PROMPT_FILE_PATH:-prompts/article-news-fa.md}
      ContentGeneration__ProviderPromptFilePaths__Groq: ${GROQ_ARTICLE_PROMPT_FILE_PATH:-prompts/article-news-groq-fa.md}
      ContentGeneration__ImagePromptFilePath: ${IMAGE_PROMPT_FILE_PATH:-prompts/article-image-fa.md}
      OpenAI__EnableWebSearch: ${OPENAI_ENABLE_WEB_SEARCH:-true}
      Groq__WriterModel: ${GROQ_WRITER_MODEL:-openai/gpt-oss-120b}
      Groq__MaxCompletionTokens: ${GROQ_MAX_COMPLETION_TOKENS:-5000}
      Groq__EnableWriterFallback: ${GROQ_ENABLE_WRITER_FALLBACK:-true}
      Groq__FallbackWriterModel: ${GROQ_FALLBACK_WRITER_MODEL:-llama-3.3-70b-versatile}
      Groq__FallbackMaxCompletionTokens: ${GROQ_FALLBACK_MAX_COMPLETION_TOKENS:-4500}
      Groq__MinimumArticleHtmlCharacters: ${GROQ_MINIMUM_ARTICLE_HTML_CHARACTERS:-4500}
      Groq__RejectShortArticles: ${GROQ_REJECT_SHORT_ARTICLES:-true}
      Groq__EnableWebResearch: ${GROQ_ENABLE_WEB_RESEARCH:-true}
      Groq__ResearchModel: ${GROQ_RESEARCH_MODEL:-groq/compound-mini}
      Groq__ResearchModelVersion: ${GROQ_RESEARCH_MODEL_VERSION:-2025-07-23}
      Groq__ResearchMaxCompletionTokens: ${GROQ_RESEARCH_MAX_COMPLETION_TOKENS:-2048}
      Groq__ResearchPromptMaxCharacters: ${GROQ_RESEARCH_PROMPT_MAX_CHARACTERS:-1200}
      Groq__MaxResearchCharacters: ${GROQ_MAX_RESEARCH_CHARACTERS:-12000}
      Groq__ContinueWithoutResearchOnFailure: ${GROQ_CONTINUE_WITHOUT_RESEARCH_ON_FAILURE:-true}
      Pollinations__BaseUrl: ${POLLINATIONS_BASE_URL:-https://image.pollinations.ai/prompt/}
      Pollinations__PromptFilePath: ${POLLINATIONS_PROMPT_FILE_PATH:-prompts/article-image-pollinations-en.md}
      Pollinations__Model: ${POLLINATIONS_MODEL:-flux}
      Pollinations__Width: ${POLLINATIONS_WIDTH:-1536}
      Pollinations__Height: ${POLLINATIONS_HEIGHT:-1024}
      Pollinations__NoLogo: ${POLLINATIONS_NO_LOGO:-true}
      Pollinations__Private: ${POLLINATIONS_PRIVATE:-true}
      Pollinations__Safe: ${POLLINATIONS_SAFE:-true}
      Pollinations__Enhance: ${POLLINATIONS_ENHANCE:-false}
      Pollinations__MaxPromptCharacters: ${POLLINATIONS_MAX_PROMPT_CHARACTERS:-700}
      Pollinations__MaxAttempts: ${POLLINATIONS_MAX_ATTEMPTS:-3}
      Pollinations__RetryDelaySeconds: ${POLLINATIONS_RETRY_DELAY_SECONDS:-30}
      WordPress__SiteUrl: ${WORDPRESS_SITE_URL}
      WordPress__PostStatus: ${WORDPRESS_POST_STATUS:-draft}
      WordPress__CategoryId: ${WORDPRESS_CATEGORY_ID}
      WordPress__RequireCategoryId: ${WORDPRESS_REQUIRE_CATEGORY_ID:-true}
      Instagram__InstagramUserId: ${INSTAGRAM_USER_ID}
      Telegram__ChannelChatId: ${TELEGRAM_CHANNEL_CHAT_ID}
      Publishing__PublishToWordPress: ${PUBLISH_TO_WORDPRESS:-true}
      Publishing__PublishToInstagram: ${PUBLISH_TO_INSTAGRAM:-true}
      Publishing__PublishToTelegram: ${PUBLISH_TO_TELEGRAM:-true}
    volumes:
      - ./src/ContentProducer.Worker/prompts:/app/prompts:ro
